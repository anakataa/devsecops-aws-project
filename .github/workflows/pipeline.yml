name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t devsecops-app ./app

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app
          format: 'table'
          exit-code: '0' # 0- its when non critical vulnerabilities< and when 1 pipline will crash if vulnerabilities are critical:** 
          severity: 'CRITICAL,HIGH'

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m # 30 min to timeout the script if it takes too long
          script: |
            
            cd ~/devsecops-aws-project/app || exit
            
            git pull origin main
            
            sudo docker build -t devsecops-app:latest .
            
            sudo docker save devsecops-app:latest -o /tmp/app.tar
            sudo k3s ctr images import /tmp/app.tar


            rm /tmp/app.tar
            
            sudo kubectl delete pod -l app=devsecops-app







